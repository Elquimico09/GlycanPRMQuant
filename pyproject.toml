[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glycanPRMQuant"
version = "1.2.1"
description = "Targeted PRM glycomics analysis from mzML data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vishal Sandilya", email = "vishal.sandilya@ttu.edu" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "seaborn",
  "statsmodels",
  "scikit-learn",
  "openpyxl",
  "scienceplots",
  "pyteomics",
  "psims",
  "glypy",
  "lxml",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "twine",
]

[project.scripts]
glycan-prmquant = "glycanPRMQuant.cli:main"

[tool.setuptools.packages.find]
include = ["glycanPRMQuant*"]

[tool.setuptools.package-data]
glycanPRMQuant = ["database/*.csv"]
